[package]
name = "vitals-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Your system's vital signs, at a glance."
license = "MIT OR Apache-2.0"
keywords = ["system-info", "fetch", "neofetch", "fastfetch", "cli"]
categories = ["command-line-utilities"]

# 包名是 vitals-rs（crates.io 上的 vitals 已被占用），
# 但用户敲的命令必须是 vitals——所以 [[bin]] 显式声明，不能靠默认推导。
[[bin]]
name = "vitals"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# 系统调用：uname（Kernel）与 statvfs（Disk）。
# 自有代码零 unsafe，全部经它的安全封装；用 uname 而不是读 /proc，
# 是为了 Kernel 模块不绑死在 Linux 上（uname 在所有 Unix 都有）。
rustix = { version = "1.1", features = ["fs", "system"] }
# 配置的反序列化。derive 是编译期的，运行时不带 proc-macro。
serde = { version = "1", features = ["derive"] }
# 错误类型：编译期展开的 proc-macro，零运行时开销。
thiserror = "2"
# 主配置格式。注意链上已经是 1.x 了，生态里大量教程还是 0.8 的写法。
toml = "1"
