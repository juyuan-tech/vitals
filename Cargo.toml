[package]
name = "vitals-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Your system's vital signs, at a glance."
license = "MIT OR Apache-2.0"
keywords = ["system-info", "fetch", "neofetch", "fastfetch", "cli"]
categories = ["command-line-utilities"]
authors = ["juyuan-tech <gxydream@outlook.com>"]
repository = "https://github.com/juyuan-tech/vitals"
readme = "README.md"
# 包只带用得上、读得懂的东西：设计笔记与工具链固定在仓库里有意义，
# 跟着包发出去只会让下载它的人多读一份内部笔记。
exclude = ["PLAN.md", "rust-toolchain.toml", ".github"]

# 包名是 vitals-rs（crates.io 上的 vitals 已被占用），
# 但用户敲的命令必须是 vitals——所以 [[bin]] 显式声明，不能靠默认推导。
[[bin]]
name = "vitals"
path = "src/main.rs"

[dependencies]
# 颜色只管「描述」，降级交给 anstream：管道的另一端不是终端时它会
# 自己去把转义码去掉，所以渲染器可以放心总是带色。
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive"] }
# 系统调用：uname（Kernel）、statvfs（Disk）、tcgetwinsize（问终端多少列）。
# 自有代码零 unsafe，全部经它的安全封装；用 uname 而不是读 /proc，
# 是为了 Kernel 模块不绑死在 Linux 上（uname 在所有 Unix 都有）。
rustix = { version = "1.1", features = ["fs", "system", "termios"] }
# 配置的反序列化。derive 是编译期的，运行时不带 proc-macro。
serde = { version = "1", features = ["derive"] }
# JSON 输出（阶段 6）。不手搓：引号、反斜杠、控制字符、代理对，
# 转义规则里每一项都能写错，而错的后果是脚本解析出一个悄悄不对劲的值。
serde_json = "1"
# 错误类型：编译期展开的 proc-macro，零运行时开销。
thiserror = "2"
# 主配置格式。注意链上已经是 1.x 了，生态里大量教程还是 0.8 的写法。
toml = "1"
# 对齐必须按显示宽度算，不能按字节数也不能按字符数（PLAN.md §6.1）。
unicode-width = "0.2"
