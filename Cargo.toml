[package]
name = "vitals-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Your system's vital signs, at a glance."
license = "MIT OR Apache-2.0"
keywords = ["system-info", "fetch", "neofetch", "fastfetch", "cli"]
categories = ["command-line-utilities"]

# 包名是 vitals-rs（crates.io 上的 vitals 已被占用），
# 但用户敲的命令必须是 vitals——所以 [[bin]] 显式声明，不能靠默认推导。
[[bin]]
name = "vitals"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
