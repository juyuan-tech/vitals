name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      # 注意：mod_module_files 属 restriction 组、默认关闭，
      # 必须由 src/lib.rs 里的 #![warn(...)] 显式开启才会在这里拦下 mod.rs。
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # 阶段 11 会换成 cargo nextest（届时加 --no-tests=pass）。
      # 现在用 cargo test：零测试用例也能正常通过。
      - name: 测试
        run: cargo test --all-targets

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      # `Cargo.toml` 里的 `rust-version = "1.85"` 是给用户看的承诺。
      # 上面那个作业跑的是 stable：哪天顺手用了更新的 API，它照样绿，
      # 而用户可以编不过。这里真按 1.85 编一遍才叫验证过。
      - name: MSRV 检查（1.85）
        run: cargo check --all-targets
