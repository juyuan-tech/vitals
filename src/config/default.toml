# Vitals 配置
#
# 由 `vitals --gen-config` 打印。这个文件**整体替换**内置默认：写了 modules，
# 内置列表就不再生效，所以想少显示几个模块，得把要留的列全。
#
# 下面这份就是内置默认视图：顺序照着 fastfetch 2.68.1 的默认视图排
# （OS → Host → Kernel → … → Locale），只多三样自己的东西：
# processes、loadavg（各一行，一眼看到机器忙不忙）和 rust（本程序自己的版本）。

config_version = 1

# 顺序即显示顺序。可选项见 `vitals --list-modules`。
#
# 每个模块都可以挂条件，条件不满足就跳过它——跳过不是错误，
# 只是这台机器没什么可显示的（比如台式机没有电池）。
#
#   platforms           只在这些平台上采集。取值：linux, macos, windows,
#                       freebsd, openbsd, netbsd, android, solaris, illumos
#   when-command-exists 命令不在 PATH 里就跳过。**只查 PATH，不执行命令**
#   when-file-exists    路径不存在就跳过；开头的 ~/ 会展开成 $HOME
#
# 例：
#
#   [[modules]]
#   type = "bios"
#
#   [[modules]]
#   type = "disk"
#   when-file-exists = "/dev/nvme0n1"
#
#   [[modules]]
#   type = "brightness"
#   when-file-exists = "/sys/class/backlight"

[[modules]]
type = "title"

[[modules]]
type = "separator"

[[modules]]
type = "os"

[[modules]]
type = "host"

[[modules]]
type = "kernel"

[[modules]]
type = "bios"

[[modules]]
type = "board"

[[modules]]
type = "chassis"

[[modules]]
type = "uptime"

[[modules]]
type = "packages"

[[modules]]
type = "shell"

[[modules]]
type = "display"

[[modules]]
type = "de"

[[modules]]
type = "wm"

[[modules]]
type = "terminal"

[[modules]]
type = "cpu"

[[modules]]
type = "memory"

[[modules]]
type = "swap"

[[modules]]
type = "disk"

[[modules]]
type = "processes"

[[modules]]
type = "loadavg"

[[modules]]
type = "battery"

[[modules]]
type = "power-adapter"

[[modules]]
type = "locale"

[[modules]]
type = "break"

[[modules]]
type = "rust"
